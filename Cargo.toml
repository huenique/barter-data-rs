[package]
name = "barter-data"
version = "0.7.0"
authors = ["JustAStream"]
edition = "2021"
license = "MIT"
documentation = "https://docs.rs/barter-data/"
repository = "https://github.com/barter-rs/barter-data-rs"
readme = "README.md"
description = "High performance & normalised WebSocket integration for leading cryptocurrency exchanges - batteries included."
keywords = ["trading", "backtesting", "crypto", "stocks", "investment"]
categories = ["accessibility", "simulation"]

[dev-dependencies]
criterion = "0.5.1"
rand = "0.8"
rust_decimal = "1.29.1"
rust_decimal_macros = "1.29.1"
tabled = "0.16.0"
tracing-subscriber = { version = "0.3.16", features = ["env-filter", "json"] }

[dependencies]
# Barter Ecosystem
barter-integration = "0.7.3"
barter-macro =  "0.1.1"

# Logging
tracing = "0.1.36"

# Async
async-trait = "0.1.57"
futures = "0.3.21"
tokio = { version = "1.39.3", features = ["sync", "macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1.9", features = ["sync"] }

# Protocol
url = "2.3.1"
reqwest = "0.12.7"

# Error
thiserror = "1.0.32"

# SerDe
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.127"

# Strategy
ta = "0.5.0"

# Date and Time
chrono = {version = "0.4.21", features = ["serde"]}

# Crypto
crc32fast = "1.3.2"
hex = "0.4.3"
hmac = "0.12.1"
sha2 = "0.10.8"

# JWT
jsonwebtoken = "9.3.0"

# UUID
uuid = { version = "1.10.0", features = ["v4"] }

# Utility
lazy_static = "1.5.0"
playwright = "0.0.20"
cached = "0.53.1"

[[bench]]
name = "sorting"
harness = false

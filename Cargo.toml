[package]
name = "barter-data"
version = "0.7.0"
authors = ["JustAStream"]
edition = "2021"
license = "MIT"
documentation = "https://docs.rs/barter-data/"
repository = "https://github.com/barter-rs/barter-data-rs"
readme = "README.md"
description = "High performance & normalised WebSocket integration for leading cryptocurrency exchanges - batteries included."
keywords = ["trading", "backtesting", "crypto", "stocks", "investment"]
categories = ["accessibility", "simulation"]

[dev-dependencies]
criterion = "0.5.1"
rand = "0.8"
tabled = "0.16.0"
tracing-subscriber = { version = "0.3.16", features = ["env-filter", "json"] }

[dependencies]
# Barter Ecosystem
barter-integration = "=0.7.3"
barter-macro = "0.1.1"

# Logging
tracing = "0.1.36"

# Async
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1.41.1", features = ["sync", "macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Protocol
url = "2.5.3"
reqwest = { version = "0.12.9", features = ["blocking"] }

# Error
thiserror = "2.0.3"

# SerDe
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.132"

# Strategy
ta = "0.5.0"

# Date and Time
chrono = { version = "0.4.21", features = ["serde"] }

# Crypto
crc32fast = "1.3.2"
hex = "0.4.3"
hmac = "0.12.1"
sha2 = "0.10.8"

# JWT
jsonwebtoken = "9.3.0"

# UUID
uuid = { version = "1.11.0", features = ["v4"] }

# Utility
lazy_static = "1.5.0"
cached = "0.54.0"
rust_decimal = "1.36.0"
rust_decimal_macros = "1.36.0"
once_cell = "1.20"

[[bench]]
name = "sorting"
harness = false
